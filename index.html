<!doctype html>
<html lang="id">
  <head>
    <script>
      (function() {
        // 1. Filter out WebSocket console errors
        const origError = console.error;
        console.error = function(...args) {
          for (let i = 0; i < args.length; i++) {
            const item = args[i];
            if (item) {
              const str = String(item.message || item.stack || item);
              if (str.includes('WebSocket')) {
                return;
              }
            }
          }
          origError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          const reasonStr = String(event.reason?.message || event.reason?.stack || event.reason || '');
          if (reasonStr.includes('WebSocket')) {
            event.preventDefault();
            event.stopPropagation();
          }
        });

        // 2. Safe Dummy WebSocket for Vite HMR in AI Studio
        const OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          function FakeWebSocket(url, protocols) {
            const isViteHmr =
              (typeof protocols === 'string' && protocols.includes('vite')) ||
              (Array.isArray(protocols) && protocols.some(function(p) { return String(p).includes('vite'); })) ||
              (typeof url === 'string' && (url.includes('vite') || url.includes('ais-dev') || url.includes('run.app')));

            if (isViteHmr) {
              const target = new EventTarget();
              target.readyState = 1; // OPEN
              target.protocol = 'vite-hmr';
              target.url = url;
              target.binaryType = 'blob';
              target.bufferedAmount = 0;
              target.extensions = '';
              target.send = function() {};
              target.close = function() {};
              Promise.resolve().then(function() {
                try {
                  target.dispatchEvent(new Event('open'));
                } catch (e) {}
              });
              return target;
            }
            return new OrigWebSocket(url, protocols);
          }
          FakeWebSocket.prototype = OrigWebSocket.prototype;
          FakeWebSocket.CONNECTING = 0;
          FakeWebSocket.OPEN = 1;
          FakeWebSocket.CLOSING = 2;
          FakeWebSocket.CLOSED = 3;
          window.WebSocket = FakeWebSocket;
        }
      })();
    </script>
